site_name: SmartFall Hardware Docs
site_url: https://smart-fall.github.io/Hardware
repo_name: Smart-Fall/Hardware
repo_url: https://github.com/Smart-Fall/Hardware
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - scheme: default
      primary: blue
      accent: light blue
      toggle: { icon: material/brightness-7, name: Switch to dark mode }
    - scheme: slate
      primary: blue
      accent: light blue
      toggle: { icon: material/brightness-4, name: Switch to light mode }
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - toc.follow

plugins:
  - search
  - minify:
      minify_html: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
    - Quick Start: getting-started/quick-start.md
    - Development Setup: getting-started/development-setup.md
  - Hardware:
    - Overview: hardware/overview.md
    - Wiring: hardware/wiring.md
    - Power: hardware/power.md
  - Firmware:
    - Architecture: firmware/architecture.md
    - Sensors: firmware/sensors.md
    - Fall Detection: firmware/fall-detection.md
    - Communication: firmware/communication.md
    - Audio: firmware/audio.md
  - Algorithm:
    - Overview: algorithm/overview.md
    - Detection Stages: algorithm/stages.md
    - Confidence Scoring: algorithm/confidence-scoring.md
  - Configuration:
    - Reference: configuration/config-reference.md
  - API Reference:
    - WiFi Endpoints: api/wifi-endpoints.md
    - BLE Protocol: api/ble-protocol.md
  - Testing:
    - Component Tests: testing/component-tests.md
    - Fall Simulation: testing/fall-simulation.md
  - Troubleshooting: troubleshooting.md
